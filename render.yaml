services:
  # 1. FastAPI Backend API
  - type: web
    name: hariram-backend-api
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        value: mock
      - key: DB_NAME
        value: hariram_db
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  # 2. React Storefront Static Site
  - type: web
    name: hariram-frontend
    runtime: static
    rootDir: frontend
    buildCommand: yarn && yarn build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
